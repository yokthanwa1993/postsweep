<!doctype html><html lang="th"><meta charset="utf-8"><title>ทดสอบความเร็ว</title><style>body{font:16px system-ui;line-height:1.8;margin:32px}iframe{width:900px;height:680px;border:1px solid #ddd}li{padding:4px}</style><h1 id="title">กำลังทดสอบความเร็วด้วยโพสต์จำลอง…</h1><ol id="results"></ol><div id="frames"></div><script type="module">
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const waitFor=async fn=>{for(let i=0;i<300;i++){if(fn())return;await sleep(25)}throw Error('timeout')};
const assert=(v,m)=>{if(!v)throw Error(m)};
const frames=document.getElementById('frames');
let passed=0;
for(const name of ['slow_spacing','speed_up','slow_down','stop_waiting','save_speed','minimize_stop']){
 const li=document.createElement('li');li.textContent=name+' — กำลังทดสอบ';document.getElementById('results').append(li);
 const f=document.createElement('iframe');
 f.src='browser-fixture.html?mode=screenshot&speed='+(['slow_spacing','speed_up','stop_waiting'].includes(name)?1:5);
 frames.append(f);await new Promise(r=>f.onload=r);
 try{
  const w=f.contentWindow;await waitFor(()=>w.result&&w.testState.dispatches.length);
  const root=w.document.getElementById('facebook-cleaner-panel').shadowRoot;
  const speed=n=>{root.getElementById('speed').value=n;root.getElementById('speed').dispatchEvent(new w.Event('input',{bubbles:true}))};
  const stop=()=>root.getElementById('stop').click();
  if(name==='slow_spacing'){
   await waitFor(()=>w.testState.dispatches.length>=3);stop();
   const d=w.testState.dispatches;assert(d[1].at-d[0].at>=1450&&d[2].at-d[1].at>=1450,'slow spacing not respected');assert(w.testState.maxInFlight===1,'slow should be serial');
  }
  if(name==='speed_up'){
   const before=w.performance.now();speed(5);await waitFor(()=>w.testState.dispatches.length>=3);
   assert(w.testState.dispatches[2].at-before<350,'speed change did not wake dispatcher');assert(w.testState.maxInFlight===3,'fast should use 3 slots');stop();
  }
  if(name==='slow_down'){
   await waitFor(()=>w.testState.inFlight===3);speed(1);const start=w.testState.dispatches.length;
   await waitFor(()=>w.testState.dispatches.length>start);stop();const d=w.testState.dispatches;
   assert(d[start].active===1,'slowing down should drain to one slot');assert(d[start].at-d[start-1].at>=1450,'new slower gap not applied');
  }
  if(name==='stop_waiting'){
   await waitFor(()=>w.testState.removed.length===1);stop();await sleep(1700);assert(w.testState.dispatches.length===1,'Stop dispatched a waiting post');
  }
  if(name==='save_speed'){
   for(const value of [2,4,1,3])speed(value);await waitFor(()=>w.testState.preferences.cleanerSpeedLevel===3);
   stop();await waitFor(()=>!w.result().running);w.startAgain();await waitFor(()=>w.__facebookCleanerRunV1.running);
   const latest=w.document.getElementById('facebook-cleaner-panel').shadowRoot;await waitFor(()=>latest.getElementById('speed').value==='3');
   assert(latest.getElementById('speed-name').textContent==='ปกติ','saved speed not restored');latest.getElementById('stop').click();
  }
  if(name==='minimize_stop'){
   root.getElementById('minimize').click();assert(root.getElementById('overlay').dataset.minimized==='true','minimize failed');
   assert(root.getElementById('panel').getAttribute('aria-modal')==='false','minimized dialog still modal');
   root.getElementById('expand').click();assert(root.getElementById('overlay').dataset.minimized==='false','expand failed');
   root.getElementById('minimize').click();root.getElementById('compact-stop').click();
  }
  await waitFor(()=>!w.result().running);assert(!w.result().failed,'unexpected error');assert(w.result().removed===w.result().unique,'duplicate post');
  li.textContent='PASS — '+name;passed++;
 }catch(e){li.textContent='FAIL — '+name+' · '+e.message;li.style.color='red'}
 f.remove();
}
document.title=`${passed===6?'PASS':'FAIL'} ${passed}/6 — Speed controls`;
document.getElementById('title').textContent=`ผลทดสอบความเร็ว ${passed}/6 ผ่าน — ไม่มีการลบโพสต์จริง`;
</script></html>
